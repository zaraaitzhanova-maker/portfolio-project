name: Run Portfolio Every Day

on:
  schedule:
    - cron: "30 19 * * 1-5"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install yfinance pandas numpy matplotlib scipy scikit-learn pandas-datareader pyomo idaes-pse

      - run: python src/model.py

      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "update" || echo "no changes"
          git push
